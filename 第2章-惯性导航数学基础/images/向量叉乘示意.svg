<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
  <title id="title">向量叉乘示意</title>
  <desc id="desc">向量 x 和 y 构成平行四边形，叉乘方向 n 垂直于该平面。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#244364" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#ffffff"/>
  <polygon points="125,300 400,315 515,160 240,145" fill="#b9d7e8" fill-opacity="0.45" stroke="#86a9bb" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="125" cy="300" r="5" fill="#244364"/>
  <g fill="none" stroke="#244364" stroke-width="4" marker-end="url(#arrow)">
    <path d="M125 300 L395 315"/>
    <path d="M125 300 L238 150"/>
    <path d="M125 300 L125 65"/>
  </g>
  <path d="M193 304 Q190 260 159 255" fill="none" stroke="#b36b21" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#244364">
    <text x="405" y="323">x</text>
    <text x="235" y="133">y</text>
    <text x="135" y="65">n = x × y</text>
    <text x="185" y="266" fill="#b36b21">θ</text>
  </g>
  <text x="125" y="365" font-family="Arial, sans-serif" font-size="16" fill="#526578">面积 = |x × y|；方向由右手定则确定</text>
</svg>
